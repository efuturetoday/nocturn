title: Notify capability
description: notify — the assistant reaching you proactively (fire-and-forget), the other half of human-in-the-loop.

family: notify

intro: >-
  The `notify` family lets the assistant **reach you** — a message to your own device, sent and
  forgotten. It is the other half of [approvals](/guides/approvals/): approval **asks and waits**;
  notify just **tells** you something ("flight delayed", "the scheduled report is ready").

glance:
  target: "the **user's channel** (host-owned, not model-chosen)"
  defaultPolicy: "runs silently — a message to your own device is not per-message approved"

tools:
  - name: notify
    href: /reference/tools/notify/
    axis: read
    desc: send a fire-and-forget notification to your device

cage:
  intro: >-
    The destination is the **host-owned channel**, not a model-chosen target, so there is no
    meaningful per-target scoping — the only sensible target is `*`. In a plugin cage you therefore
    allow or deny `notify` as a whole:
  lang: json
  examples: |
    { "family": "notify", "target": "*", "access": ["read"] }
  notes:
    - >-
      Because the target is fixed, this is effectively a **family-level** allow/deny, rather than the
      host/path scoping the [network](/reference/http/) and [file](/reference/files/) capabilities
      offer. To go the other way — require approval on *every* notification instead of the silent
      default — a workspace or agent policy tightens `notify` to **ask** (see the safety note below).

limits:
  - >-
    **Rate limit** — enforced. The Guard caps `notify` at **10 per minute** (anti-spam, so a runaway
    loop cannot buzz your device endlessly). It is applied **per capability family, not per tool**, and
    only user-facing families are capped — bursty reads (a script doing many `http.read`/`file.read`)
    are never rate-limited. Over the cap, the call is refused with a **retry-after**, so the assistant
    learns when it can try again (it may wait, schedule a wake, or tell you it can't right now).

leakScanning:
  intro: >-
    The message is **leak-scanned on egress** before it leaves: a stored vault secret in the `message`
    or `title` is **blocked**, so a prompt-injected caller cannot smuggle a credential out inside a
    notification.
  points:
    - "`notify` injects no credentials of its own — nothing flows *in*."

sections:
  - title: Why it runs silently — and why that is safe
    body: |
      A notification to your **own** device is not the kind of world-changing effect that warrants a
      per-message *"may I tell you this?"* prompt, so under the default policy it runs silently. What
      keeps that safe is **structural**, not a prompt: the destination is **host-owned, never
      model-chosen** — the message goes to *your* configured channel, and the model supplies only the
      *content*, never the *target* (exactly like host-side credential injection). So `notify` can
      never become an exfiltration channel to a third party.

      It still passes the one gateway, so a workspace or agent **policy can tighten it to ask** if you
      want every notification approved.
  - title: Channel
    body: >-
      Notifications are delivered over the same out-of-band channel as approvals (a native push to the
      paired companion app — see [approve from your phone](/guides/approvals/)). When no push channel is
      configured, a notification falls back to a dim inline line in the TUI (the attended case).
