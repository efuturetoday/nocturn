title: HTTP capability
description: http.read and http.write — reaching the network, gated per host, with host-injected credentials.

family: http

intro: >-
  The `http` family lets the assistant reach the network. It is split into two tools so the
  **tool the caller picks already fixes the effect axis**: `http.read` is a read, `http.write`
  is a write. The security layer gates on that, never on the raw HTTP verb.

glance:
  target: "a **hostname** — e.g. `api.github.com`"
  defaultPolicy: reads run silently; writes ask for approval

tools:
  - name: http.read
    href: /reference/tools/http-read/
    axis: read
    desc: read a URL (GET/HEAD)
  - name: http.write
    href: /reference/tools/http-write/
    axis: write
    desc: send data (POST/PUT/PATCH/DELETE)

cage:
  intro: >-
    A cage bounds where this capability may reach. For `http` the `target` is a hostname,
    an IP, or a CIDR range (a glob is allowed); `access` is the read/write axis. See the
    [capabilities overview](/reference/capabilities/#what-a-target-looks-like-it-is-per-family)
    for the shared `(family, target, access)` rules.
  lang: json
  examples: |
    { "family": "http", "target": "api.github.com",        "access": ["read"] }
    { "family": "http", "target": "*.githubusercontent.com", "access": ["read"] }
    { "family": "http", "target": "api.example.com",        "access": ["read", "write"] }
    { "family": "http", "target": "10.0.0.0/8",              "access": ["read"] }
    { "family": "http", "target": "*",                       "access": ["read"] }
  notes:
    - A hostname glob (`*.github.com`) matches subdomains; `*` on its own means **any host**.
    - >-
      A **CIDR range** (`10.0.0.0/8`, `2001:db8::/32`) confines the caller to a subnet — it matches
      a request made **to an IP in that range** (a hostname is matched by a hostname glob, since the
      broker never resolves names).
    - '`access` must be explicit — a missing `access` is a fail-closed error, never a silent "both".'
    - >-
      The cage only sets the *maximum* reach. Within it, writes still ask each time (until you
      grant them).

limits:
  - >-
    **Rate limit** — _TBD_. Enforced **per capability family, not per tool** once wired; the
    sliding-window rate limiter exists as a primitive but is not yet attached to the Guard, so no
    per-family call cap is enforced today.
  - "**Response size** — the response body is capped at **10 MiB** in memory."

credentials:
  - >-
    Credentials are attached **host-side, at the boundary, for the matching host only**. The guest
    never sees the token and never chooses it — the destination does.
  - >-
    A request that carries its **own** credential is **rejected outright**: userinfo in the URL
    (`user:pass@host`), or an `Authorization` / `Cookie` / `Proxy-Authorization` / `X-Api-Key` header.

leakScanning:
  intro: "Bidirectional — a secret can neither be smuggled out nor echoed back:"
  points:
    - >-
      **Egress (the request):** the URL, request headers, and body are scanned **before** the host's own
      credential is stamped in — a request carrying a stored vault secret is blocked.
    - >-
      **Ingress (the response):** the body and header values are scanned and any echoed secret is
      **redacted** before the model sees it.
    - >-
      **Stripped outright:** credential-bearing response headers — `Set-Cookie`, `Set-Cookie2`,
      `Authorization`, `WWW-Authenticate`, `Proxy-Authenticate` (the guest has no cookie jar).
