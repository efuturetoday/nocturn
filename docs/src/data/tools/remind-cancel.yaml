title: remind.cancel
description: Cancel a pending reminder by id.

capability:
  family: remind
  href: /reference/reminders/
axis: read

intro: >-
  Cancel a pending reminder. See the [`remind` capability](/reference/reminders/) for details.

input:
  - field: id
    type: string
    required: true
    notes: "The reminder id (from [`remind`](/reference/tools/remind/) or [`remind.list`](/reference/tools/remind-list/))."

output:
  code: |
    { "id": "rem-…", "cancelled": true }
  lang: json

js:
  wrapper: null
  gate: |
    const res = JSON.parse(nocturn.call("remind.cancel", { id: "rem-abc" }));
