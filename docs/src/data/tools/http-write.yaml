title: http.write
description: Send data to a URL with a mutating method (POST/PUT/PATCH/DELETE).

capability:
  family: http
  href: /reference/http/
axis: write

intro: >-
  Send data with a mutating method. This **asks for approval** unless a standing grant covers it.
  Reach, cage, and credential injection are documented on the [`http` capability](/reference/http/).

input:
  - field: url
    type: string
    required: true
    notes: The URL to send to.
  - field: method
    type: string
    required: false
    notes: "`POST`, `PUT`, `PATCH`, or `DELETE`. Default `POST`."
  - field: body
    type: string
    required: false
    notes: The request body.
  - field: content_type
    type: string
    required: false
    notes: "`Content-Type` of the body. Default `application/json`."

output: >-
  The same `{status, statusText, headers, body}` envelope as
  [`http.read`](/reference/tools/http-read/).

js:
  wrapper: |
    const r = await fetch("https://api.example.com/messages", {
      method: "POST",
      body: JSON.stringify({ text: "hi" }),
    });
  gate: |
    const res = JSON.parse(nocturn.call("http.write", {
      url: "https://api.example.com/messages",
      method: "POST",
      body: JSON.stringify({ text: "hi" }),
      content_type: "application/json",
    }));
