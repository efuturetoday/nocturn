title: file_stat
description: Stat a workspace path — does it exist, is it a directory, how big is it.

kind:
  name: file
  href: /nocturn/reference/gate/file/
gated: false
axis: read

intro: >-
  Ask about a path without reading it. Ungated, like the other file reads — see the
  [`file` kind](/nocturn/reference/gate/file/).

input:
  - field: path
    type: string
    required: true
    notes: Workspace-relative path.

output:
  text: "A JSON object; a missing path answers rather than erroring:"
  code: |
    { "exists": true, "isDir": false, "size": 214 }
  lang: json
  after: 'A path that is not there returns `{"exists": false}` — absence is an answer, not a failure.'

js:
  wrapper: |
    const s = await nocturn.fs.stat("notes/todo.md");
    if (s.exists && !s.isDir) console.log(s.size);
  call: |
    const s = JSON.parse(nocturn.call("file_stat", { path: "notes/todo.md" }));
