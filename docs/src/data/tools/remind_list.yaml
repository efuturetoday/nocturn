title: remind_list
description: List the pending reminders, soonest first.

kind:
  name: remind
  href: /nocturn/reference/gate/remind/
gated: false
axis: read

intro: >-
  See what is scheduled. Takes no arguments and asks nothing: it reads back only what the assistant
  itself scheduled, so there is no `remind` check on this path — only
  [`remind`](/nocturn/reference/tools/remind/) itself makes one. See the
  [`remind` kind](/nocturn/reference/gate/remind/).

input: none

output:
  text: "A JSON array, soonest first:"
  code: |
    [ { "id": "rem-…", "fireAt": "2026-07-18T09:00:00+02:00", "message": "stretch", "title": "" } ]
  lang: json

js:
  wrapper: |
    const pending = nocturn.reminders(); // already parsed, soonest first
  call: |
    const pending = JSON.parse(nocturn.call("remind_list", {}));

notes: >-
  The ids in the result are what [`remind_cancel`](/nocturn/reference/tools/remind_cancel/) takes,
  which is the whole reason this exists: without it the assistant can schedule a reminder and then
  never find it again, because a run that set one has usually ended by the time anyone wants it
  gone.


  Pending only. A reminder that has already fired is not listed — it is not a log.
