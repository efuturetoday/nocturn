title: notify
description: Send a notification to the user out of band, fire and forget.

kind:
  name: notify
  href: /reference/gate/notify/
  target: the constant `user`
gated: true
axis: write

intro: >-
  Tell you something without waiting for you. It does **not** ask a question and does not block —
  an action that needs your yes goes through an [approval](/guides/approvals/) instead. The tool
  checks the [`notify` kind](/reference/gate/notify/), which the workspace root policy allows, so
  today it runs without a prompt.

input:
  - field: message
    type: string
    required: true
    notes: The notification text. Leak-scanned — a message carrying a vault secret is blocked.
  - field: title
    type: string
    required: false
    notes: Optional short title.

output:
  text: "Confirmation that the message was handed to the channel:"
  code: |
    { "sent": true }
  lang: json

js:
  wrapper: |
    nocturn.notify("Backup finished", "Nocturn");
  call: |
    nocturn.call("notify", { message: "Backup finished", title: "Nocturn" });

notes: >-
  The destination is host-owned: the model writes the words, never the recipient. That is what makes
  a silent send defensible — the only remaining risk is the content, which the egress scan covers.
