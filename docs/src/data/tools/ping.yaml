title: ping
description: Send one ICMP echo to a host and report whether it answered.

kind:
  name: net
  href: /reference/gate/net/
  target: the hostname or IP being pinged
gated: true
axis: read

intro: >-
  One ICMP echo, one answer. Gated on the [`net` kind](/reference/gate/net/) like everything else
  that leaves the machine: a ping sweep is a perfectly good way to map a network you were never
  meant to see, so reachability is a decision, not a freebie.

input:
  - field: host
    type: string
    required: true
    notes: The hostname or IP to ping.

output:
  text: "A JSON object — reachability and round-trip time:"
  code: |
    { "host": "example.com", "ip": "93.184.216.34", "ok": true, "rtt_ms": 12 }
  lang: json
  after: "`ok: false` means no answer within the timeout, not that the host does not exist."

js:
  wrapper: |
    const r = nocturn.ping("example.com");
    if (!r.ok) console.log("no answer");
  call: |
    const r = JSON.parse(nocturn.call("ping", { host: "example.com" }));

notes: >-
  Unprivileged ICMP is an OS permission. Where the platform refuses it the call fails after the
  approval, as an error from the socket — not as a denial from the gate.
