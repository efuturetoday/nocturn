title: wake
description: Pause and resume yourself later — schedule this conversation's own re-invocation after a delay.

kind: null
gated: false
axis: none

intro: >-
  Schedule the running conversation's **own re-invocation**: after `seconds`, this same conversation
  comes back with `note` as the prompt. Use it to wait and then continue — poll something, or
  re-check after a delay. It is the in-session cousin of a [reminder](/nocturn/reference/tools/remind/),
  which fires a detached notification instead.

input:
  - field: seconds
    type: number
    required: true
    notes: Delay before resuming. **Clamped** to 1 s … 1 h.
  - field: note
    type: string
    required: true
    notes: "The prompt to resume with, e.g. `\"re-check the deploy status\"`."

output:
  text: "The delay that was actually accepted, after clamping:"
  code: |
    { "wakeInSeconds": 300 }
  lang: json

js:
  wrapper: |
    nocturn.wake(300, "re-check the deploy status");
  call: |
    nocturn.call("wake", { seconds: 300, note: "re-check the deploy status" });

notes: >-
  **Bounded, not gated.** `wake` reaches nothing external — it only schedules a continuation — so it
  carries no authority and never calls the gate. Any tool called in the *resumed* turn is gated
  normally. The risk it does carry is a runaway self-waking loop, so it is bounded instead: the delay
  is clamped and the number of pending wakes is capped. A wake resumes the exact conversation that
  scheduled it; delete that chat and its pending wakes go with it.

  Pending wakes are **persisted** (`wakes.json` in the workspace), so one survives a restart the way
  a [reminder](/nocturn/reference/tools/remind/) does — including one that came due while the daemon
  was down, which resumes as soon as it is back.
