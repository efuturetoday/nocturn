title: remind_cancel
description: Cancel a pending reminder by id.

kind:
  name: remind
  href: /nocturn/reference/gate/remind/
gated: false
axis: write

intro: >-
  Drop a scheduled reminder. It is a write — it changes state — and it is still ungated, because it
  can only remove something the assistant itself scheduled, and the worst case is a missed nudge.
  See the [`remind` kind](/nocturn/reference/gate/remind/).

input:
  - field: id
    type: string
    required: true
    notes: "The reminder id, as returned by [`remind`](/nocturn/reference/tools/remind/) or [`remind_list`](/nocturn/reference/tools/remind_list/)."

output:
  text: "Whether that id was actually pending:"
  code: |
    { "id": "rem-…", "cancelled": true }
  lang: json
  after: "`cancelled: false` means nothing was pending under that id — an unknown id is not an error."

js:
  wrapper: |
    nocturn.cancelReminder("rem-…");
  call: |
    nocturn.call("remind_cancel", { id: "rem-…" });

notes: >-
  **A write that is still ungated**, which is the exception worth stating rather than hiding. The
  argument is reach, as everywhere else: the only thing it can remove is something this assistant
  scheduled through [`remind`](/nocturn/reference/tools/remind/), so the worst an injection achieves
  is a nudge that never arrives. Gating it would put an approval in front of routine housekeeping —
  the assistant tidying up after itself — and a person asked that often stops reading.


  An unknown id answers `cancelled: false` rather than failing, so a script can cancel
  optimistically without first checking
  [`remind_list`](/nocturn/reference/tools/remind_list/).
