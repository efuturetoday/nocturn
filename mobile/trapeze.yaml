# The version and build number live in package.json — `version` and `config.buildNumber` — and are
# written from here into both platforms, so a release is one edit:
#
#     npm pkg set config.buildNumber=2 && npm run cap:config
#
# `config` because npm exports `npm_package_config_*` to scripts while a custom top-level field is
# not exported at all. That keeps cap:config a line of environment assignments rather than a
# `node -p` — which colours numbers, and once fed trapeze an ANSI escape that became `versionCode NaN`.
#
# The `vars:` block is what makes trapeze substitute from the environment; without it the values
# resolve to empty and it writes that silently. No defaults on purpose: a missing number should be
# visible rather than quietly become one nobody chose.
vars:
  VERSION:
  BUILD:

platforms:
  ios:
    targets:
      App:
        version: $VERSION
        buildNumber: $BUILD

  android:
    versionName: $VERSION
    versionCode: $BUILD
