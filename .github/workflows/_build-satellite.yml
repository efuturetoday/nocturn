name: _build-satellite

# The ESP32-S3 firmware build, called by ci-satellite.yml as the gate and by release.yml on a
# `satellite-v*` tag. Same container satellite/build.sh uses on a developer's machine, so what CI
# compiles is what you compile.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Firmware — compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v5.5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The image carries the toolchain but the entrypoint that activates it is replaced by the job,
      # so the environment is sourced by hand.
      - name: Build
        working-directory: satellite
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build

      # Where the flash went. The partition table gives the factory image 3 MB and there is no OTA
      # slot, so an image that outgrows it is not a warning — it is a board that cannot be flashed.
      - name: Size
        working-directory: satellite
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size

      # merge-bin writes into the build directory, where everything else already is. Four files
      # rather than one: the merged image is what a fresh board wants at offset 0, the three parts
      # are what an incremental flash of a known board needs.
      - name: Merge the image
        working-directory: satellite
        run: |
          . "$IDF_PATH/export.sh"
          idf.py merge-bin -o merged.bin

      - uses: actions/upload-artifact@v7
        with:
          name: satellite-images
          path: |
            satellite/build/factory_01.bin
            satellite/build/merged.bin
            satellite/build/bootloader/bootloader.bin
            satellite/build/partition_table/partition-table.bin
          retention-days: 1
