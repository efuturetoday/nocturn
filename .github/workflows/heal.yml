name: Heal

# The other half of the drift policy (see .github/actions/drift). The only job that can write to the
# repository, and the only one that runs no project code: it applies patches the detecting jobs
# produced. Its whole vocabulary is git apply, git commit, git push.
#
# A reusable workflow rather than a composite action: a composite runs inside the caller's job and
# would inherit its token and its tree, which is the arrangement this split exists to prevent.
#
# Callers gate it on `if: github.event_name == 'push'` and list every detecting job in `needs`, so a
# red build heals nothing.

on:
  workflow_call:
    inputs:
      subject:
        description: 'The commit subject, e.g. chore(ci): regenerate what drifted from its sources'
        required: true
        type: string
      what:
        description: One sentence naming what did not match, for the commit body.
        required: true
        type: string

# No workflow-level `permissions:` on purpose. There is one job and it declares its own, so a
# default here would buy nothing — and for a CALLED workflow it is not documented whether the
# callee's own top-level block is a default or a ceiling. If it were a ceiling it would cap the job
# at read and every push would 403, in the last job of a push run. The grant that matters is at the
# call site.
jobs:
  heal:
    name: Heal what drifted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # Credentials stay — this is the job that pushes.
      #
      # The SHA, not the branch name: the patches are diffs against the tree the detecting jobs
      # checked out, and a branch tip is a moving target. Applying to a drifted base fails outright
      # for the binary artefact (git apply --binary checks the preimage blob id) and, worse, can
      # SUCCEED against the wrong base for text, because plain git apply matches on context.
      #
      # The push below then targets the branch by name. If it moved meanwhile the push is rejected,
      # which is the right outcome — a rejected heal is a retry, a wrong one is a commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      # continue-on-error because the common case is that NOTHING drifted, and a pattern that matches
      # no artifact is an error to this action rather than an empty result. A green build must not go
      # red for having nothing to heal.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: drift-*
          path: /tmp/drift
          merge-multiple: true

      - name: Apply and commit
        env:
          SUBJECT: ${{ inputs.subject }}
          WHAT: ${{ inputs.what }}
        run: |
          shopt -s nullglob
          patches=(/tmp/drift/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "Nothing drifted."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "== $(basename "$p")"
            git apply --binary --stat "$p"
            git apply --binary "$p"
          done
          applied=$(basename -a "${patches[@]}" | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$SUBJECT" -m "$WHAT Regenerated by CI.

          patches: $applied
          from:    $GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "::notice::Healed $GITHUB_REF_NAME: $applied"
