name: CI

# The Go side: it builds, the tests pass under the race detector, and one CGO-free binary comes out
# for six targets. The docs site and the companion app have their own workflows.
#
# The speaker tests need a checkpoint that is not committed and skip themselves when
# NOCTURN_SPEAKER_MODEL is unset, so this stays green without downloading a model.
#
# Two things here are generated and committed — the interpreter guest and internal/tui/*_gsx.go.
# Both are reconciled the same way: a pull request that let one drift FAILS, a push to main HEALS.
# Detection and healing are separate jobs because detection runs a build script, a third-party
# generator and the test suite, which on a pull request is the author's code, and that must not
# happen while holding a token that can push. See heal at the bottom.
#
# The Go sources are the repository root, so there is no `paths:` allowlist that stays true as the
# tree grows — the filter is `'**'` minus the other domains, which also means a new top-level thing
# runs CI until someone decides otherwise. `paths` with negations rather than `paths-ignore`, since
# `paths-ignore` does not support `!` and the two cannot be combined. `satellite/` and `sdk/` are
# deliberately not excluded: a firmware-only change runs the full Go matrix.
#
# The two lists are written out twice because Actions does not support YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!mobile/**'
      - '!media/**'
      - '!.github/workflows/docs.yml'
      - '!.github/workflows/mobile.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!mobile/**'
      - '!media/**'
      - '!.github/workflows/docs.yml'
      - '!.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; main runs are not, because heal writes and the window
# between its commit and its push is the one place cancellation is not free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one committed binary artefact, rebuilt from its own sources on every run.
  #
  # nocturn-qjs.wasm is go:embed'd, so a plain `go build` needs no wasi-sdk and no quickjs checkout —
  # what "one binary, no foreign runtime" costs. The price is a megabyte of opaque bytes in git that
  # nobody rebuilds, and it came due: the build script named a source file its own pinned quickjs
  # release does not have, silently, because recipe and artefact had no way to disagree out loud.
  #
  # So on main the rebuild is committed rather than merely reported: a tampered .wasm is overwritten
  # by one built from reviewable sources. Changing what the guest does means changing the C.
  #
  # The commit is heal's, not this job's — build.sh downloads a tarball, fetches a remote and
  # compiles five C files from the checked-out tree, so there must be no credential for it to find.
  #
  # The workflow's path filter cannot hide a swapped artefact (it lives under internal/), but it does
  # cost the other property: a docs-only push no longer re-reconciles recipe and artefact. If that is
  # wanted back the answer is a weekly `schedule:`, not pretending the filter is free.
  guest:
    name: Interpreter guest — rebuilt from source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The whole script is the key, not a grep for two of its variables: the quickjs pin that
      # actually decides what is fetched is QJS_NG_SHA, and the wasi-sdk digests are in a function —
      # neither matched the old pattern, so correcting a digest served the old cache. No restore-keys,
      # so there is no prefix fallback that could serve a cache built from different pins.
      - name: Resolve the toolchain pins
        id: pins
        run: |
          {
            echo "key=$(sha256sum internal/script/qjs/build.sh | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: internal/script/qjs/.buildcache
          key: qjs-toolchain-${{ runner.os }}-${{ steps.pins.outputs.key }}

      - name: Rebuild the guest
        run: internal/script/qjs/build.sh

      - uses: ./.github/actions/drift
        with:
          paths: internal/script/qjs/nocturn-qjs.wasm
          name: guest
          hint: internal/script/qjs/build.sh

      # Everything downstream builds against THIS artefact, not whatever is in the tree — which
      # removes the race between the heal commit and the jobs that need its result.
      - uses: actions/upload-artifact@v7
        with:
          name: interpreter-guest
          path: internal/script/qjs/nocturn-qjs.wasm
          retention-days: 1

  go:
    name: Go — build, vet, race tests
    needs: guest
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Defence in depth, not the guarantee: what keeps a push-capable token out of this job is
      # `permissions` (workflow-level contents: read). This only keeps it out of .git/config while
      # `go test` and a third-party generator run.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: interpreter-guest
          path: internal/script/qjs

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # DISABLED until internal/tui/ is committed — it is not in HEAD today, so the generator would
      # run against a path the repository does not have. Re-enable in the commit that lands the
      # terminal UI, not before.
      #
      # *_gsx.go are generated from .gsx and committed, so a plain build needs no generator. The
      # generator itself is fetched at a tag, which is safe for a reason worth naming: `go install
      # pkg@version` verifies against sum.golang.org, so a repointed tag is caught there.
      #
      # - name: Regenerate the GSX
      #   run: |
      #     go install github.com/grindlemire/go-tui/cmd/tui@v0.18.2
      #     "$(go env GOPATH)/bin/tui" generate ./internal/tui/...
      #
      # - uses: ./.github/actions/drift
      #   with:
      #     paths: internal/tui/*_gsx.go
      #     name: gsx
      #     hint: tui generate ./internal/tui/...

      # gofmt is a gate, not a suggestion: a diff that only reformats hides the change under it.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal agentkit)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The agentkit modules are siblings joined by go.work, not subpackages, so ./... at the root
      # does not reach them. internal/onnx/reference is left out on purpose: a nested module pulling
      # in gomlx, which exists precisely so that dependency never enters nocturn's graph.
      - name: Test the agentkit modules
        run: |
          for mod in agentkit/gate agentkit/openai agentkit/tools agentkit/runtime agentkit/gemini; do
            echo "== $mod"
            (cd "$mod" && go build ./... && go vet ./... && go test -race ./...)
          done

  crosscompile:
    name: One binary, six targets
    needs: guest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The guest is embedded into every one of these, so they build against the rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: interpreter-guest
          path: internal/script/qjs

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 is the whole point: nothing to install alongside the binary. A build that
      # needed cgo would break the claim, not just the build.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/nocturn

  # Granted here and nowhere else in this file: heal is the only job that can write, and it runs no
  # project code. `needs` covers EVERY job, not just the two that detect drift — an artefact must not
  # be committed while a target it has to build for is red.
  heal:
    needs: [guest, go, crosscompile]
    if: github.event_name == 'push'
    permissions:
      contents: write
    # No timeout-minutes here: it is not a valid key on a job that calls a reusable workflow. The
    # limit lives on heal.yml's own job.
    uses: ./.github/workflows/heal.yml
    with:
      subject: "chore(ci): regenerate what drifted from its sources"
      what: "Committed artefacts did not match what their sources produce."
