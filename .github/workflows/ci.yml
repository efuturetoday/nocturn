name: CI

# The Go side: it builds, the tests pass under the race detector, and one CGO-free binary comes out
# for six targets. The speaker tests skip themselves when NOCTURN_SPEAKER_MODEL is unset.
#
# Generated-and-committed files are reconciled here as everywhere: a pull request that let one drift
# FAILS, a push to main HEALS, from a separate job that runs no project code.
#
# The Go sources are the repository root, so the filter is `'**'` minus the other domains rather than
# an allowlist — a new top-level thing runs CI until someone decides otherwise.
#
# `.github/**` is excluded and then three paths re-included: this workflow, because a change to the
# Go pipeline must run it, and the heal workflow and drift action, because the jobs below use them.
# Last match wins, which is why the negation comes first. `paths-ignore` cannot express this at all,
# it supports no `!`. Written out twice: Actions has no YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!mobile/**'
      - '!media/**'
      - '!satellite/**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_heal.yml'
      - '.github/actions/drift/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!mobile/**'
      - '!media/**'
      - '!satellite/**'
      - '!.github/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_heal.yml'
      - '.github/actions/drift/**'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; main runs are not, because heal writes and the window
# between its commit and its push is the one place cancellation is not free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one committed binary artefact, rebuilt from source every run. nocturn-qjs.wasm is go:embed'd,
  # so a plain `go build` needs no wasi-sdk — the price is a megabyte of opaque bytes nobody rebuilds,
  # and it came due once: the recipe named a file its pinned quickjs does not have, silently.
  #
  # Rebuilding and committing is the hardening: a tampered .wasm is overwritten by one built from
  # reviewable C. The commit is heal's, not this job's — build.sh runs code from the checkout, so
  # there must be no credential here for it to find.
  guest:
    name: QJS WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The whole script is the key, not a grep for two of its variables: the quickjs pin that
      # actually decides what is fetched is QJS_NG_SHA, and the wasi-sdk digests are in a function —
      # neither matched the old pattern, so correcting a digest served the old cache. No restore-keys,
      # so there is no prefix fallback that could serve a cache built from different pins.
      - name: Resolve the toolchain pins
        id: pins
        run: |
          {
            echo "key=$(sha256sum internal/script/qjs/build.sh | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: internal/script/qjs/.buildcache
          key: qjs-toolchain-${{ runner.os }}-${{ steps.pins.outputs.key }}

      - name: Rebuild the guest
        run: internal/script/qjs/build.sh

      - uses: ./.github/actions/drift
        with:
          paths: internal/script/qjs/nocturn-qjs.wasm
          name: guest
          hint: internal/script/qjs/build.sh

      # Everything downstream builds against THIS artefact, not whatever is in the tree — which
      # removes the race between the heal commit and the jobs that need its result.
      - uses: actions/upload-artifact@v7
        with:
          name: interpreter-guest
          path: internal/script/qjs/nocturn-qjs.wasm
          retention-days: 1

  go:
    name: Go
    needs: guest
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Defence in depth, not the guarantee: what keeps a push-capable token out of this job is
      # `permissions` (workflow-level contents: read). This only keeps it out of .git/config while
      # `go test` and a third-party generator run.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: interpreter-guest
          path: internal/script/qjs

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # *_gsx.go are generated from .gsx and committed, so a plain build needs no generator. The tag
      # is safe unpinned: `go install pkg@version` verifies against sum.golang.org, so a repointed
      # tag is caught there rather than by us.
      - name: Regenerate the GSX
        run: |
          go install github.com/grindlemire/go-tui/cmd/tui@v0.18.2
          "$(go env GOPATH)/bin/tui" generate ./internal/tui/...

      - uses: ./.github/actions/drift
        with:
          paths: internal/tui/*_gsx.go
          name: gsx
          hint: tui generate ./internal/tui/...

      # gofmt is drift like everything else here: a pull request that left a file unformatted fails,
      # a push to main is reformatted for you. Nobody has ever wanted to fix gofmt by hand, and the
      # heal commit is its own commit — so it cannot hide a change under a reformat, which is what a
      # mixed diff would do.
      #
      # Only .go files, and that is not decoration: the tidy gate below reconciles go.mod and go.sum,
      # and two drift checks over one path would each emit a patch containing the same lines. The
      # second `git apply` in heal would then fail.
      - name: Format
        run: gofmt -w cmd internal agentkit

      - uses: ./.github/actions/drift
        with:
          paths: 'cmd/**/*.go internal/**/*.go agentkit/**/*.go'
          name: gofmt
          hint: gofmt -w cmd internal agentkit

      # Healing works here only because every import now resolves through a `replace`. Without one,
      # tidy answers an unresolved import with a network pseudo-version of our own sibling module —
      # green, and wrong, and exactly the kind of answer a machine must not be allowed to commit.
      # That was the state until agentkit/gemini was added to the root go.mod.
      - name: Tidy the modules
        run: |
          go mod tidy
          for mod in agentkit agentkit/gate agentkit/openai agentkit/runtime agentkit/tools agentkit/gemini; do
            (cd "$mod" && go mod tidy)
          done

      - uses: ./.github/actions/drift
        with:
          paths: 'go.mod go.sum agentkit/go.mod agentkit/go.sum agentkit/*/go.mod agentkit/*/go.sum'
          name: gomod
          hint: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The agentkit modules are siblings joined by go.work, not subpackages, so ./... at the root
      # does not reach them. internal/onnx/reference is left out on purpose: a nested module pulling
      # in gomlx, which exists precisely so that dependency never enters nocturn's graph.
      - name: Test the agentkit modules
        run: |
          for mod in agentkit/gate agentkit/openai agentkit/tools agentkit/runtime agentkit/gemini; do
            echo "== $mod"
            (cd "$mod" && go build ./... && go vet ./... && go test -race ./...)
          done

  crosscompile:
    name: Cross-Compile
    needs: guest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The guest is embedded into every one of these, so they build against the rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: interpreter-guest
          path: internal/script/qjs

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # CGO_ENABLED=0 is the whole point: nothing to install alongside the binary. A build that
      # needed cgo would break the claim, not just the build.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/nocturn

  # Granted here and nowhere else in this file: heal is the only job that can write, and it runs no
  # project code. `needs` covers EVERY job, not just the two that detect drift — an artefact must not
  # be committed while a target it has to build for is red.
  heal:
    needs: [guest, go, crosscompile]
    if: github.event_name == 'push'
    permissions:
      contents: write
    # No timeout-minutes here: it is not a valid key on a job that calls a reusable workflow. The
    # limit lives on _heal.yml's own job.
    uses: ./.github/workflows/_heal.yml
    with:
      subject: "chore(ci): regenerate what drifted from its sources"
      what: "Committed artefacts did not match what their sources produce."
