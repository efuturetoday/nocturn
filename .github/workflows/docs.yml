name: Docs

# Builds docs/ on pull requests, publishes to Pages on main. Both halves here — one workflow per
# thing that builds, so there is no second copy of the build steps.
#
# The site is served under /nocturn — astro.config.mjs sets `base` accordingly — because Pages
# serves a project repository at owner.github.io/repo. Attaching a domain later means adding a
# docs/public/CNAME and removing that base, which is 112 hand-written absolute links either way.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# pages/id-token belong to deploy alone — build runs npm ci, and id-token would let an install
# script mint a token asserting this repository's identity.
permissions:
  contents: read

jobs:
  build:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    # Per ref, so pull-request builds never queue behind a deploy.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # --ignore-scripts: no dependency executes anything at install time. Verified rather than
      # assumed — sharp and esbuild both resolve prebuilt linux-x64 packages from the lockfile, and
      # the site builds. A local `npm install` is NOT covered by this.
      - run: npm ci --ignore-scripts
        working-directory: docs

      # Also validates every tool and gate-kind YAML against the Zod schema, so a reference page
      # that describes a tool wrongly fails here rather than being published wrong.
      - name: Build the site
        run: npx astro build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  # Only main publishes; without the guard a pull request would deploy over the live site.
  # `github.ref`, not `event_name != pull_request`: workflow_dispatch has no branch filter, so the
  # looser test would let any branch be published onto the live site by hand.
  deploy:
    name: Pages Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write

    # The site is what must not race, so the group is here and not on the workflow. In-progress
    # deploys are left alone: cancelling mid-deploy is how a site ends up half-updated.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
