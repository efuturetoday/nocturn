name: Docs

# Publishes docs/ to GitHub Pages on every push to main.
#
# The site is served at its own domain rather than under /nocturn, which is not vanity: Starlight
# rewrites the links it generates itself, but the 112 hand-written absolute links in the pages and
# the sidebar would all need a path prefix — and would need it removed again the moment the domain
# is attached. docs/public/CNAME is what tells Pages the domain; the DNS records live in Cloudflare.
#
# Pages does not serve private repositories. Until this one is public, the workflow is a no-op that
# fails at the deploy step; the build job above it still tells you the site compiles.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Pages needs to write its own deployment; nothing else here writes anything.
permissions:
  contents: read
  pages: write
  id-token: write

# One live site, so a second run supersedes a queued one rather than racing it. In-progress runs are
# left alone: cancelling mid-deploy is how a site ends up half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # This also validates every tool and gate-kind YAML against the Zod schema, so a reference page
      # that describes a tool wrongly fails here rather than being published wrong.
      - run: npx astro build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
