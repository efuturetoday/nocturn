name: Release Please

# Derives each component's next version from the commits that touched it and keeps one release pull
# request up to date. Merging that pull request is the release: it tags, and release.yml then builds
# the artefacts for whichever tag appeared.
#
# Assignment is by PATH, not by commit scope — which matters here, because the scopes are semantic
# (serve, hitl, vault) rather than component-shaped. A fix(serve) bumps nocturn itself because
# internal/serve/ is in the root package.
#
# Tags: `v0.1.1` for nocturn itself, `mobile-v0.1.1`, `satellite-v0.1.0`. Only the first is bare, and
# not for symmetry's sake — Go resolves a root module's version from a plain vX.Y.Z tag and nothing
# else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tags: ${{ steps.tags.outputs.list }}

    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps mobile/package.json and stops; trapeze is what writes that number into
      # the two native projects, and ci-mobile.yml fails when they disagree — so the release pull
      # request would be red on arrival. Doing it here keeps ONE writer for the native projects.
      #
      # The build number is settled here too, and for the same reason it is settled at all: nothing
      # else knows a release is happening. release-please only touches `version`, so config.buildNumber
      # sat at 1 for every release ever — which Android reads as "not newer" and refuses to install
      # over what a tester already has. tools/build-number.mjs derives it from the version, so the
      # number that ships is in the tag rather than computed somewhere at upload time.
      #
      # separate-pull-requests means one pull request per component, and the action's per-path
      # outputs cover releases only — `pr` is merely the first of them. So the mobile one is found by
      # its branch name, which release-please builds as
      # `release-please--branches--<target>--components--<component>`.
      - name: Apply the mobile version and build number to the native projects
        if: steps.release.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(printf '%s' "$PRS" |
            jq -r '.[] | select(.headBranchName | endswith("components--mobile")) | .headBranchName')
          if [ -z "$branch" ]; then
            echo "No mobile release pull request in this run."
            exit 0
          fi
          git fetch --depth=1 origin "$branch"
          git checkout "$branch"
          cd mobile
          npm ci --ignore-scripts
          npm pkg set config.buildNumber="$(node tools/build-number.mjs)"
          npm run cap:config
          cd ..
          if git diff --quiet -- mobile/package.json mobile/android mobile/ios; then
            echo "The native projects already match package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(mobile): apply the release version to the native projects"
          git push origin "HEAD:$branch"

      # The tags just cut, as a JSON list for the matrix below. Named one by one rather than derived
      # from `paths_released`, because the per-package outputs cannot be indexed by a matrix variable
      # — and three explicit lines are clearer than the expression that would do it. A fourth package
      # means a fourth line here.
      - name: Collect the tags
        id: tags
        env:
          ROOT: ${{ steps.release.outputs.tag_name }}
          MOBILE: ${{ steps.release.outputs['mobile--tag_name'] }}
          SATELLITE: ${{ steps.release.outputs['satellite--tag_name'] }}
        run: |
          list=$(jq -cn --args '$ARGS.positional | map(select(. != ""))' "$ROOT" "$MOBILE" "$SATELLITE")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "tagged: $list"

  # release-please tags with GITHUB_TOKEN, and GitHub starts no workflow from what that token does.
  # So the tag push cannot trigger release.yml — it is called here instead, which is what the tool's
  # own documentation does. One call per tag, because a single merge can release several components.
  release:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.release-please.outputs.tags) }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # The mobile tag signs and ships to TestFlight two levels down, in _release-ios.yml. Secrets do
    # not cross a workflow_call boundary on their own, and there are two of them between here and
    # there — so `inherit` is needed at BOTH call sites or the Apple credentials arrive empty.
    secrets: inherit
    with:
      tag: ${{ matrix.tag }}
