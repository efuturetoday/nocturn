name: Release

# Attaches artefacts to the release release-please just created. The tag prefix says which component
# was released, and each job gates on its own.
#
# The mobile and satellite halves build nothing of their own — they call the same _build-web.yml,
# _build-android.yml and _build-satellite.yml the gates call, then attach what came out. A release
# that built its own copy would be shipping something no gate ever looked at.
#
# The binaries are the exception, and for a reason: ci.yml cross-compiles six targets to /dev/null
# to prove they compile. Here they are built for real, with the version stamped in.

# Two ways in. `workflow_call` is the one that matters: release-please tags with GITHUB_TOKEN, and
# GitHub refuses to start workflows from what that token does — a deliberate loop guard, not a gap.
# So release-please.yml calls this directly once it has tagged, which is what the tool's own
# documentation does too. The tag trigger stays for tags pushed by a human.
on:
  push:
    tags:
      - 'v*'
      - 'mobile-v*'
      - 'satellite-v*'
  workflow_call:
    inputs:
      tag:
        description: >
          The tag to build artefacts for. Only set on a `workflow_call`; a tag push has no inputs at
          all and every expression below falls back to `github.ref_name`.
        required: true
        type: string
    # Named one by one rather than inherited. `secrets: inherit` hands the callee EVERY secret the
    # repository has, including the ones added next year for something unrelated — and the callee here
    # runs fastlane, which is a large third-party surface. Optional because only `mobile-v*` reaches
    # the job that uses them; the other two tags call this with none.
    #
    # On a tag PUSH there is no caller at all, and `secrets.X` below resolves to the repository secret
    # directly. Declaring them here does not change that path.
    secrets:
      APP_STORE_CONNECT_KEY_ID:
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_KEY_P8:
        required: false
      IOS_DIST_CERT_P12:
        required: false
      IOS_DIST_CERT_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # The caller runs on main, so the ref has to be named — otherwise this builds main and labels
      # it with the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # -X main.version is the whole reason `nocturn version` has ever printed anything but "dev":
      # cmd/nocturn/cli.go:26 declares the variable and has described this recipe in a comment since
      # long before anything supplied it.
      #
      # CGO_ENABLED=0 for the same reason ci.yml uses it — a build that needed cgo would break the
      # claim on the box, not just the build.
      - name: Build and archive
        env:
          CGO_ENABLED: 0
        run: |
          version="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            bin="nocturn"; [ "$os" = windows ] && bin="nocturn.exe"
            GOOS="$os" GOARCH="$arch" go build \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/$bin" ./cmd/nocturn
            tar -czf "dist/nocturn_${version}_${os}_${arch}.tar.gz" -C dist "$bin"
            rm -f "dist/$bin"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -l dist

      # No body, body_path or generate_release_notes on purpose: with all three unset the action keeps
      # the existing body (`body = workflowBody || existingReleaseBody`), which is release-please's
      # changelog. Setting any of them would overwrite it.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*

  # check-drift is off here: the same check already ran on this commit when it was pushed to main,
  # and on a tag there is no heal job to consume a patch — it would emit one into the void.
  web:
    if: startsWith(inputs.tag || github.ref_name, 'mobile-v')
    uses: ./.github/workflows/_build-web.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      check-drift: false

  android:
    needs: web
    uses: ./.github/workflows/_build-android.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      check-drift: false

  # iOS goes to TestFlight rather than into the release's assets — Apple has no sideloading, so there
  # is no file to attach. The archive is signed here, which proves more than the unsigned compile the
  # gate runs. The five secrets are what the lane fetches; without them it fails on the first
  # ENV.fetch.
  ios:
    needs: web
    uses: ./.github/workflows/_release-ios.yml
    secrets:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  # The packaging jobs carry a `package-` prefix so the ids above can be the plain domain names the
  # gates use — a check reads the same in ci-mobile.yml and here.
  package-mobile:
    name: APK Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mobile-apk
          path: apk

      # Named after the release rather than left as app-debug.apk, which says nothing on a download
      # page. Android is the only half with a file to download; the iOS one went to TestFlight, and
      # the release notes carry the link.
      - name: Name it after the release
        run: |
          version="${TAG#mobile-v}"
          mv apk/app-debug.apk "apk/nocturn_${version}.apk"
          ls -l apk

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: apk/*

  satellite:
    if: startsWith(inputs.tag || github.ref_name, 'satellite-v')
    uses: ./.github/workflows/_build-satellite.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  package-satellite:
    name: Firmware Release
    needs: satellite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: satellite-images
          path: images

      # The artefact keeps the build tree's shape, so bootloader/ and partition_table/ are nested.
      # Flattened here, where the version is known and the names can say what they are.
      - name: Name them after the release
        run: |
          version="${TAG#satellite-v}"
          mkdir -p out
          mv images/factory_01.bin "out/nocturn-satellite_${version}.bin"
          mv images/merged.bin     "out/nocturn-satellite_${version}_merged.bin"
          mv images/bootloader/bootloader.bin images/partition_table/partition-table.bin out/
          ls -l out

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/*
